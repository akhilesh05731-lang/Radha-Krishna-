<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radha Krishna Dot Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    width:100vw;
    height:100vh;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// ===============================
// PHOTO
// ===============================

const img = new Image();

/*
    Apni photo ka naam yaha rakho
*/
img.src = "radha-krishna.jpg";


// ===============================
// DOT SETTINGS
// ===============================

let dots = [];

const DOT_SIZE = 1.7;
const GAP = 5;

let progress = 0;
let started = false;


// ===============================
// CREATE DOTS
// ===============================

function createDots(){

    dots = [];

    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    const size = Math.min(W * 0.82, H * 0.82);

    off.width = size;
    off.height = size;

    octx.drawImage(
        img,
        0,
        0,
        size,
        size
    );

    const data = octx.getImageData(
        0,
        0,
        size,
        size
    ).data;

    for(let y = 0; y < size; y += GAP){

        for(let x = 0; x < size; x += GAP){

            const i = (y * size + x) * 4;

            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];
            const a = data[i+3];

            const brightness =
                (r + g + b) / 3;

            // Dark areas ko ignore karo
            if(a > 50 && brightness > 25){

                const targetX =
                    W/2 - size/2 + x;

                const targetY =
                    H/2 - size/2 + y;

                // Random starting position
                const angle =
                    Math.random() * Math.PI * 2;

                const distance =
                    Math.max(W,H) *
                    (0.4 + Math.random()*0.7);

                const startX =
                    W/2 + Math.cos(angle)*distance;

                const startY =
                    H/2 + Math.sin(angle)*distance;

                dots.push({

                    x:startX,
                    y:startY,

                    tx:targetX,
                    ty:targetY,

                    r:r,
                    g:g,
                    b:b,

                    delay:Math.random()*0.45,

                    speed:
                        0.015 +
                        Math.random()*0.025
                });
            }
        }
    }

    started = true;
}


// ===============================
// ANIMATION
// ===============================

function animate(){

    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0,0,W,H);

    progress += 0.004;

    dots.forEach(dot => {

        let p =
            (progress - dot.delay);

        if(p < 0) p = 0;

        if(p > 1) p = 1;

        // Smooth movement
        const ease =
            p * p * (3 - 2*p);

        dot.x +=
            (dot.tx - dot.x) *
            dot.speed *
            3;

        dot.y +=
            (dot.ty - dot.y) *
            dot.speed *
            3;

        // Glow
        ctx.shadowBlur = 8;

        ctx.shadowColor =
            `rgb(${dot.r},${dot.g},${dot.b})`;

        ctx.fillStyle =
            `rgb(${dot.r},${dot.g},${dot.b})`;

        ctx.beginPath();

        ctx.arc(
            dot.x,
            dot.y,
            DOT_SIZE,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}


// ===============================
// START
// ===============================

img.onload = () => {

    createDots();

    // Black screen se start
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,H);

    animate();
};


// ===============================
// PHOTO NOT FOUND
// ===============================

img.onerror = () => {

    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "radha-krishna.jpg photo folder me rakho",
        W/2,
        H/2
    );
};

</script>

</body>
</html>
