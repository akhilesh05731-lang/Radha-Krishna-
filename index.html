<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Radha Krishna Dot Reveal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =================================================
   SETTINGS
================================================= */

const IMAGE_NAME = "6351-Radhakrishna-min.jpg";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let dots = [];

let image = new Image();

let animationStart = 0;
let restarting = false;


/* =================================================
   CANVAS
================================================= */

function resize(){

    const ratio = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * ratio;
    canvas.height = H * ratio;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    if(image.complete && image.naturalWidth > 0){
        makeDots();
    }
}

window.addEventListener("resize",resize);


/* =================================================
   LOAD IMAGE
================================================= */

image.onload = function(){

    resize();

    makeDots();

};

image.onerror = function(){

    /*
      अगर image load नहीं होती तो black screen
      की जगह message दिखाई देगा।
    */

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="white";
    ctx.textAlign="center";
    
        H/2
    );

    ctx.font="14px Arial";

        H/2 + 30
    );
};


/* =================================================
   IMPORTANT
================================================= */

image.src = IMAGE_NAME;


/* =================================================
   CREATE DOTS
================================================= */

function makeDots(){

    dots = [];

    const maxWidth = W * 0.94;
    const maxHeight = H * 0.90;

    const scale = Math.min(
        maxWidth / image.naturalWidth,
        maxHeight / image.naturalHeight
    );

    const imgWidth =
        image.naturalWidth * scale;

    const imgHeight =
        image.naturalHeight * scale;

    const left =
        (W - imgWidth) / 2;

    const top =
        (H - imgHeight) / 2;


    /*
      छोटा canvas बनाकर photo को sample करेंगे
    */

    const sample = document.createElement("canvas");

    const sampleWidth =
        Math.max(100,Math.floor(imgWidth / 4));

    const sampleHeight =
        Math.max(100,Math.floor(imgHeight / 4));

    sample.width = sampleWidth;
    sample.height = sampleHeight;

    const sctx =
        sample.getContext("2d");

    sctx.drawImage(
        image,
        0,
        0,
        sampleWidth,
        sampleHeight
    );


    const pixels =
        sctx.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
        ).data;


    /*
      हर pixel को dot में बदलना
    */

    for(let y=0;y<sampleHeight;y++){

        for(let x=0;x<sampleWidth;x++){

            const index =
                (y * sampleWidth + x) * 4;

            const r = pixels[index];
            const g = pixels[index+1];
            const b = pixels[index+2];
            const a = pixels[index+3];

            if(a < 20) continue;


            /*
              कुछ dots skip करके
              animation को beautiful बनाया गया है
            */

            if(Math.random() > 0.62)
                continue;


            const finalX =
                left +
                (x / sampleWidth) * imgWidth;

            const finalY =
                top +
                (y / sampleHeight) * imgHeight;


            dots.push({

                x:Math.random()*W,

                y:Math.random()*H,

                targetX:finalX,

                targetY:finalY,

                r:r,

                g:g,

                b:b,

                size:
                    Math.random()*1.8 + 0.6,

                delay:
                    Math.random()*1800

            });

        }

    }


    animationStart =
        performance.now();

    restarting = false;

    requestAnimationFrame(animation);
}


/* =================================================
   SMOOTH
================================================= */

function smooth(t){

    return t * t * (3 - 2*t);

}


/* =================================================
   ANIMATION
================================================= */

function animation(time){

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const elapsed =
        time - animationStart;


    let complete = true;


    for(const dot of dots){

        let progress =
            (elapsed - dot.delay) / 5000;


        if(progress < 0){

            progress = 0;
            complete = false;

        }


        if(progress < 1){

            complete = false;

        }


        if(progress > 1)
            progress = 1;


        const eased =
            smooth(progress);


        /*
          Dots धीरे-धीरे अपनी final जगह पर जाएँगे
        */

        const x =
            dot.x +
            (dot.targetX-dot.x)*eased;


        const y =
            dot.y +
            (dot.targetY-dot.y)*eased;


        /*
          हल्का glow
        */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            dot.size,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            "rgb(" +
            dot.r + "," +
            dot.g + "," +
            dot.b + ")";


        ctx.shadowBlur = 7;

        ctx.shadowColor =
            "rgb(" +
            dot.r + "," +
            dot.g + "," +
            dot.b + ")";


        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /*
      Animation complete होने के बाद
      थोड़ी देर रुककर फिर शुरू होगी
    */

    if(complete && !restarting){

        restarting = true;

        setTimeout(function(){

            makeDots();

        },3000);

        return;

    }


    requestAnimationFrame(animation);

}


/* =================================================
   START
================================================= */

resize();

</script>

</body>
</html>
