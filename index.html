<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radha Krishna Dot Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #05030a;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];
let targetPoints = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* --------------------------------
   RADHA-KRISHNA SILHOUETTE
   -------------------------------- */

function createTarget() {

    targetPoints = [];

    const cx = W / 2;
    const cy = H / 2;

    // Krishna head
    addCircle(cx - 55, cy - 95, 70);

    // Radha head
    addCircle(cx + 55, cy - 80, 62);

    // Krishna body
    addEllipse(cx - 55, cy + 45, 75, 150);

    // Radha body
    addEllipse(cx + 55, cy + 60, 80, 160);

    // Peacock feather
    addEllipse(cx - 5, cy - 185, 22, 55);

    // Flute
    addLine(
        cx - 125, cy - 20,
        cx + 110, cy + 10,
        8
    );

    // Decorative aura
    addRing(cx, cy + 5, 205);
    addRing(cx, cy + 5, 225);
}

function addCircle(x, y, r) {

    for (let a = 0; a < Math.PI * 2; a += 0.035) {

        const radius = r * Math.sqrt(Math.random());

        targetPoints.push({
            x: x + Math.cos(a) * radius,
            y: y + Math.sin(a) * radius
        });
    }
}

function addEllipse(x, y, rx, ry) {

    for (let a = 0; a < Math.PI * 2; a += 0.04) {

        const radius = Math.sqrt(Math.random());

        targetPoints.push({
            x: x + Math.cos(a) * rx * radius,
            y: y + Math.sin(a) * ry * radius
        });
    }
}

function addLine(x1, y1, x2, y2, thickness) {

    const length = Math.hypot(x2-x1, y2-y1);
    const count = Math.floor(length / 3);

    for (let i = 0; i < count; i++) {

        const t = i / count;

        targetPoints.push({
            x: x1 + (x2-x1)*t + (Math.random()-0.5)*thickness,
            y: y1 + (y2-y1)*t + (Math.random()-0.5)*thickness
        });
    }
}

function addRing(x, y, r) {

    for (let a = 0; a < Math.PI * 2; a += 0.025) {

        targetPoints.push({
            x: x + Math.cos(a) * r,
            y: y + Math.sin(a) * r
        });
    }
}


/* --------------------------------
   CREATE PARTICLES
   -------------------------------- */

function createParticles() {

    particles = [];

    targetPoints.forEach((p, i) => {

        particles.push({

            x: Math.random() * W,
            y: Math.random() * H,

            tx: p.x,
            ty: p.y,

            size: Math.random() * 2.2 + 0.5,

            delay: Math.random() * 120,

            progress: 0
        });
    });
}


/* --------------------------------
   ANIMATION
   -------------------------------- */

let startTime = performance.now();

function animate(time) {

    ctx.clearRect(0, 0, W, H);

    // dark background
    ctx.fillStyle = "#05030a";
    ctx.fillRect(0, 0, W, H);

    const elapsed = time - startTime;

    particles.forEach((p) => {

        let t = Math.max(
            0,
            Math.min(1, (elapsed - p.delay) / 3500)
        );

        // smooth movement
        const ease = t * t * (3 - 2 * t);

        p.x += (p.tx - p.x) * 0.035;
        p.y += (p.ty - p.y) * 0.035;

        const glow = 0.5 + Math.sin(time * 0.004 + p.tx) * 0.5;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255, ${150 + glow*80}, 50, ${0.55 + glow*0.45})`;

        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(255,190,70,0.8)";

        ctx.fill();

        ctx.shadowBlur = 0;
    });

    requestAnimationFrame(animate);
}


/* --------------------------------
   START
   -------------------------------- */

createTarget();
createParticles();

requestAnimationFrame(animate);

</script>

</body>
</html>
